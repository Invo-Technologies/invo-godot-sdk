name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Headless tests (Godot ${{ matrix.godot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Verified version. To declare an older compatibility floor for the
        # Asset Library listing, add it here and let CI prove it.
        godot: ["4.7.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ matrix.godot }}-linux-x86_64

      - name: Download Godot ${{ matrix.godot }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${{ matrix.godot }}-stable/Godot_v${{ matrix.godot }}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${{ matrix.godot }}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot

      - name: Import project (builds the script class cache)
        run: ~/godot-bin/godot --headless --import

      - name: Run test suite
        run: ~/godot-bin/godot --headless --script res://tests/run_tests.gd
